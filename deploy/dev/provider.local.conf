# The lists the dev composition's auth-provider reads beside its environment
# (docker-compose.yml): a development composition only, with a public client
# and a registry reached over plain http on the host. A real deployment writes
# its own local layer (the generated config/local.conf.example).
outbound.allow = ["host.docker.internal"]
outbound.plain-internal = ["host.docker.internal:3002"]
audit.receivers = [log]
clients.registered = [
	{
		id = "dev-client"
		kind = public
		method = none
		sections {
			client-allowance {
				grants = ["https://dplaax.dev/oauth/grant-type/did"]
			}
		}
	}
]
