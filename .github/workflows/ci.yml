name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      # Each version reports, so a failure on one is told apart from one on both.
      fail-fast: false
      matrix:
        # The Node minor the Dockerfiles build on (the floor engines.node
        # admits), and the newest major, as upstream auth.provider tests.
        # Dependabot bumps the Dockerfiles but not this, so move the first
        # entry with them.
        node: ["24.22", "26"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # check-latest resolves the newest patch from the release manifest;
      # without it setup-node takes any matching version the runner image has
      # cached, which can predate a security release. engines.node in
      # package.json names the patched floor.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level=moderate

      # pnpm's frozen install tolerates stale extra importers, so assert the
      # invariant directly: the committed lockfile must never contain the
      # local-only instances/* importers (see Makefile clean-instances).
      - name: assert lockfile has no instances importers
        run: |
          if grep -q '^  instances/' pnpm-lock.yaml; then
            echo "pnpm-lock.yaml contains instances/* importers — run 'make clean-instances' and recommit"
            exit 1
          fi

      - run: pnpm -r run build

      # Workspace-wide typecheck (after build: workspace siblings' .d.mts come
      # from their dist). Runs the root script so the package set is defined
      # in one place (package.json "typecheck").
      - run: pnpm run typecheck

      - run: pnpm -r run test

  # Workspace-mode scaffold smoke (create-app.md § 6.3): generate instances
  # from the generators, then boot them against the PR's package state (root
  # overrides → workspace:*). The policy-verifier is built and typechecked; the
  # provider runs its sources and takes a DID-grant round trip.
  smoke-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22"
          check-latest: true
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # The provider generator reads the provin modules from a project pnpm
      # installed them into: this PR's packages, packed and served from a
      # loopback registry. Staged once, for make instances and the
      # regeneration below.
      - name: stage the provin packages
        run: |
          # Assigned first, so a failed staging fails this step.
          stage="$(node scripts/stage-provin-packages.mjs --dir "$RUNNER_TEMP/stage")"
          echo "PROVIN_STAGE=$stage" >> "$GITHUB_ENV"

      - run: make instances

      # The generated manifest must stay honest (create-app.md § 6.3.1):
      # byte-identical to direct generator output (nothing in the workspace
      # pipeline may mutate it), and free of workspace:/file:/link: leakage.
      - name: assert generated manifests are unmutated
        run: |
          ref="$(git rev-parse HEAD)"
          node packages/create-provider/dist/cli.mjs provider \
            --outside-from "$PROVIN_STAGE" --out "$RUNNER_TEMP/regen/provider" --no-git-init
          node packages/create-policy-verifier/dist/cli.mjs policy-verifier \
            --dplaax-module-ref "$ref" --port 3001 --out "$RUNNER_TEMP/regen/policy-verifier" --no-git-init
          for inst in provider policy-verifier; do
            diff "$RUNNER_TEMP/regen/$inst/package.json" "instances/$inst/package.json"
            if grep -Eq '"(workspace|file|link):' "instances/$inst/package.json"; then
              echo "specifier leak in $inst/package.json"
              exit 1
            fi
          done

      - run: make smoke

  # Consumer-mode scaffold smoke (create-app.md § 6.3): the exact external
  # consumer experience — generate OUTSIDE the workspace and install with no
  # workspace assistance.
  #
  # The provider's provin packages come from a registry, as from npm: this
  # commit's, packed and served from a loopback npm registry on the runner,
  # which the app's .npmrc names. Nothing is fetched from GitHub, so it runs on
  # pull requests too.
  smoke-consumer-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22"
          check-latest: true
          cache: "pnpm"

      # Workspace install only to build the generator CLI and pack the provin
      # packages.
      - run: pnpm install --frozen-lockfile

      # Serves until the job ends: the app's install and its image build below
      # fetch the provin packages from this loopback npm registry.
      - name: stage the provin packages and serve them
        run: |
          nohup node scripts/stage-provin-packages.mjs --dir "$RUNNER_TEMP/stage" --serve \
            > "$RUNNER_TEMP/stage.path" 2> "$RUNNER_TEMP/stage.log" &
          pid=$!
          for _ in $(seq 1 180); do
            [ -s "$RUNNER_TEMP/stage.path" ] && exit 0
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/stage.log"
              echo "::error::staging the provin packages failed"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/stage.log"
          echo "::error::the provin packages were not staged within 3 minutes"
          exit 1

      - name: generate, install and run the provider outside the workspace
        run: |
          out="$RUNNER_TEMP/consumer"
          node packages/create-provider/dist/cli.mjs provider \
            --outside-from "$(cat "$RUNNER_TEMP/stage.path")" --out "$out/provider" --no-git-init
          # The provider runs its sources: install as its README says, the
          # lockfile held to the record of the packages outside the release.
          (cd "$out/provider" && pnpm install --lockfile-only && node scripts/check-outside.mjs \
            && pnpm install --frozen-lockfile --ignore-scripts)
          # One real DID-grant round trip (assertion → /oauth/token → 200 +
          # signed claims, tampered-signature reject), then introspection and
          # revocation: the boot smoke alone let the PDP surface drift and the
          # missing @noble/ed25519 through.
          node scripts/smoke-did-grant.mjs "$out/provider" 3100

      - name: docker build and run the provider's standalone Dockerfile
        run: |
          out="$RUNNER_TEMP/consumer"
          # Host network: the image's install fetches the provin packages from
          # the loopback npm registry on the runner, which the app's .npmrc names.
          docker build --network host -t smoke/provider "$out/provider"
          # The published image runs in production: an https issuer, no
          # insecure origin. The smoke's own DID registry stub runs on the
          # runner and is reached from the container as host.docker.internal.
          node scripts/smoke-did-grant.mjs --production --image smoke/provider 3100

  # The verifier's dPLaaX module resolves from the pinned git ref (the § 3.4
  # pnpm block emitted into the scaffold handles transitive resolution). Runs
  # on push only: the commit must be fetchable from GitHub.
  smoke-consumer-verifier:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22"
          check-latest: true
          cache: "pnpm"

      # Workspace install only to build the generator CLI.
      - run: pnpm install --frozen-lockfile

      - name: generate, install, build, boot outside the workspace
        run: |
          out="$RUNNER_TEMP/consumer"
          node packages/create-policy-verifier/dist/cli.mjs policy-verifier \
            --dplaax-module-ref "$GITHUB_SHA" --port 3001 --out "$out/policy-verifier" --no-git-init
          (cd "$out/policy-verifier" && pnpm install && pnpm run build && pnpm run typecheck)
          ./scripts/smoke-instance.sh "$out/policy-verifier" 3001 /healthcheck /verify

      # The standalone Dockerfile, built and run: the image answers its health
      # endpoint and refuses /verify without a token (401).
      - name: docker build and run the standalone Dockerfile
        run: |
          out="$RUNNER_TEMP/consumer"
          # The verifier's last stage is its test helper; the image to run is `runtime`.
          docker build --target runtime -t smoke/policy-verifier "$out/policy-verifier"
          ./scripts/smoke-image.sh smoke/policy-verifier 3001 3001 /healthcheck /verify -- \
            -e OAUTH_JWT_ALGORITHM=HS256 \
            -e OAUTH_JWT_SECRET=smoke.only.secret.at.least.32.bytes.long \
            -e OAUTH_JWT_ISSUER=https://smoke.invalid \
            -e OAUTH_JWT_AUDIENCE=https://smoke-api.invalid
