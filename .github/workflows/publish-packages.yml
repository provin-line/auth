name: publish-packages

# Publishes the provin packages (did-dplaax, auth-did-grant,
# auth-did-grant-store, auth-dplaax-registry) to npm through trusted
# publishing. Each package on npmjs.com names this file, this repository and
# the `npm` environment as its trusted publisher, so no job holds a token: npm
# takes the publish job's OIDC identity and signs each version's provenance.
#
# Two jobs, so that the one with that identity installs and builds nothing:
# `pack` installs, builds, tests and packs without `id-token`; `publish`
# takes the tarballs and runs npm alone. scripts/publish-packages.mjs packs
# and publishes only the versions the registry does not hold, so a re-run of
# the same tag publishes nothing twice.
#
# Trigger: version tags. A tag whose version (`v` dropped) is not the root
# package.json's and every workspace package's is refused, as is a tag on a
# commit main does not hold. A tag on an edited copy of this file would run
# that copy, so the refusals hold only where the repository's tag ruleset
# restricts who may create `v*` tags. The `npm` environment admits `v*` tags
# alone.
#
# When npm's OIDC exchange fails, npm says so at verbose level only and then
# reports an authentication error: rerun with `--loglevel verbose` on the
# publish step to see why.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One run at a time across tags: two tags close together would race to
# publish the same versions.
concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.pack.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a tag on a commit main does not hold
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is on $GITHUB_SHA, which main does not hold"
            exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # No dependency cache: the release's tarballs come from this job, and a
      # cache restored from another ref's run could feed them.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22"
          check-latest: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "./packages/did-dplaax" --filter "./packages/did-grant" --filter "./packages/did-grant-store" --filter "./packages/dplaax-registry" build

      - run: pnpm --filter "./packages/did-dplaax" --filter "./packages/did-grant" --filter "./packages/did-grant-store" --filter "./packages/dplaax-registry" test

      - id: pack
        run: node scripts/publish-packages.mjs pack "$RUNNER_TEMP/packages" --tag "$GITHUB_REF_NAME"

      - if: steps.pack.outputs.count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: pack
    if: needs.pack.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # The script alone: this job installs nothing.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/publish-packages.mjs
            /packages/did-dplaax/package.json
            /packages/did-grant/package.json
            /packages/did-grant-store/package.json
            /packages/dplaax-registry/package.json
          sparse-checkout-cone-mode: false

      # Its npm is past the 11.5.1 that trusted publishing needs, which the
      # script checks.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22"
          check-latest: true
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      - run: node scripts/publish-packages.mjs publish "$RUNNER_TEMP/packages"
