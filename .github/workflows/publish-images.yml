name: publish-images

# Builds and pushes the two generated-instance images (policy-verifier,
# auth-provider) to GHCR, so consumers (e.g. provin.oss's quickstart)
# reference a published image instead of re-running generation-in-Dockerfile
# themselves (gap-backlog L1: "provin.auth GHCR image publish CI").
#
# Triggers: manual (workflow_dispatch, builds the selected ref) and version
# tags. Every build pushes an immutable sha-<sha> tag plus a moving tag named
# after the branch/tag that triggered it. A version-tag build (v1.2.3) also
# pushes a moving minor tag (v1.2) — the provin.oss quickstart pins that so it
# tracks patch releases without a pin bump; pin the sha-<sha> tag instead for
# exact reproducibility.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - generator: policy-verifier
            port: "3001"
            scaffold_args: ""
          - generator: auth-provider
            port: "3000"
            # Placeholder only — overridden at runtime via
            # DPLAAX_REGISTRY_BASE_URL (the image stays deployment-generic).
            scaffold_args: "--registry-base-url http://localhost:8443"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Multi-arch: consumers include Apple-silicon dev machines (linux/arm64)
      # as well as amd64 CI/servers; a single-arch image fails their pull
      # outright ("no matching manifest").
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/provin-line/auth-${{ matrix.generator }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern=v{{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=tag

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/generated-instance.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GENERATOR=${{ matrix.generator }}
            AUTH_REF=${{ github.sha }}
            PORT=${{ matrix.port }}
            SCAFFOLD_ARGS=${{ matrix.scaffold_args }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
