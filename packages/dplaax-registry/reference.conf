# The defaults of `dplaax-registry`'s section, from its schema (src/module.mts).
# For reading only: the module applies these itself, and the app does not load this file.
dplaax-registry {
	# Registry names a DID may carry beyond url's host, for DIDs kept under an earlier registry's name.
	allowed-registries = []
	# How long a resolution may take, from 1ms to 1m; outbound's own timeout still applies.
	timeout = 5s
	# The largest document taken, from 1B to 16MiB; outbound's own max-response-size still applies.
	max-document-size = 64KiB
	# Required, no default: url.
}
