# The defaults of `did-grant`'s section, from its schema (src/module.mts).
# For reading only: the module applies these itself, and the app does not load this file.
did-grant {
	# The signature algorithms a request may use: built in, or contributed at `signatureAlgorithms`.
	supported-algorithms = ["ed25519_raw"]
	# How far a signed message's timestamp may be from this host's clock, from `1s` to `1d`.
	message-max-age = 5m
	# The auth contract the grant enforces (dplaax.spec).
	auth-contract = "LEGACY_DID_LOGIN@1"
	# The operator's opt-in an OWNER contract requires (rule `auth.migration.enable-gate`).
	owner-migration-ratified = false
	# The longest lifetime of a `LEGACY_DID_LOGIN@1` token (rule `auth.legacy.did-login`).
	legacy-max-ttl = 15m
	# Required, no default: revocation-latency-bound, access-token-lifetime.
}
